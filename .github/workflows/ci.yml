# Checks are defined in the Makefile. 5.4 is the supported minimum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ocaml: ["5.4", "5.5"]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
      # postgres-eio is pinned to its release until opam-repository has it.
      - run: opam pin add -n -y postgres-eio "git+https://github.com/hyphatech/postgres-eio.git#0.1.0"
      - run: opam install . --deps-only --with-test --with-dev-setup -y
      # Use setup-ocaml's switch instead of the Makefile's local one.
      - run: make lint OPAM="opam exec --"
      - run: make test OPAM="opam exec --"

  # The oldest versions the opam file allows, as opam-repository checks.
  lower-bounds:
    runs-on: ubuntu-24.04
    env:
      OPAMCRITERIA: +removed,+count[version-lag,solution]
      OPAMFIXUPCRITERIA: +removed,+count[version-lag,solution]
    steps:
      - uses: actions/checkout@v5
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"
      # postgres-eio is pinned to its release until opam-repository has it.
      - run: opam pin add -n -y postgres-eio "git+https://github.com/hyphatech/postgres-eio.git#0.1.0"
      - run: opam install . --deps-only --with-test -y
      - run: opam list --installed --columns=name,version
      - run: make build OPAM="opam exec --"
      - run: make test OPAM="opam exec --"
